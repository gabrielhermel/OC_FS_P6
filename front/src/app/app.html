<main class="main">
  <h1>{{ title() }}</h1>

  @if (loading()) {
    <p>Loading topics...</p>
  }

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  @if (!loading() && !error()) {
    <ul>
      @for (topic of topics(); track topic.id) {
        <li>
          <strong>{{ topic.name }}</strong
          >: {{ topic.description }}
        </li>
      }
    </ul>
  }
</main>

<router-outlet />

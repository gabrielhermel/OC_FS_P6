<div class="login-container">
  <div class="login-card">
    <h1 class="form-header">Se connecter</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="usernameOrEmail">E-mail ou nom d'utilisateur</label>
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <input matInput id="usernameOrEmail" formControlName="usernameOrEmail" required />
          @if (usernameOrEmail.hasError('required') && usernameOrEmail.touched) {
            <mat-error>Ce champ est requis</mat-error>
          }
        </mat-form-field>
      </div>

      <div class="form-field">
        <label for="password">Mot de passe</label>
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <input
            matInput
            [type]="hidePassword() ? 'password' : 'text'"
            id="password"
            formControlName="password"
            required
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword.set(!hidePassword())"
            [attr.aria-label]="'Hide password'"
            [attr.aria-pressed]="hidePassword()"
          >
            <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          @if (password.hasError('required') && password.touched) {
            <mat-error>Le mot de passe est requis</mat-error>
          }
        </mat-form-field>
      </div>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="loginForm.invalid || isSubmitting()"
      >
        Se connecter
      </button>
    </form>
  </div>
</div>

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mdd?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:mdd_user}
spring.datasource.password=${DB_PASSWORD:mdd_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.connections.pooling=WARN
spring.jpa.open-in-view=false

# CORS configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# JWT Configuration
jwt.secret=${JWT_SECRET:d956d6ca1194b4935b10488c006f214d85a8997844c11fc09b46d8ec636b8f11}
jwt.expiration=${JWT_EXPIRATION:86400000}